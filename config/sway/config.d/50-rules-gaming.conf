# Rules for fullscreen games. Source 2 (CS2) and the Steam client are both
# X11, so they arrive through XWayland and match on `class`, not `app_id`.

# Screen tearing needs two independent permissions and is only ever considered
# for a fullscreen window: sway-output(5) gates it per output, sway(5) gates it
# per window, and tearing happens only where both allow it. So `output *
# allow_tearing yes` does not mean "tearing everywhere" — it lifts the
# output-level veto, and a window still has to opt in, either through the
# tearing-control protocol or through an explicit rule below. Ordinary desktop
# compositing is untouched.
#
# Without this a fullscreen game is pinned to the panel's refresh rate (60 Hz
# on the 4K Dell) and pays a full vblank of input latency.
#
# max_render_time is deliberately left at its default of `off`, which is what
# sway-output(5) recommends alongside allow_tearing: a page flip then happens
# as soon as the client updates, rather than waiting for a render deadline.
output * allow_tearing yes

# Counter-Strike 2. Native Linux build on Vulkan — no Proton involved.
# Verify the class against `swaymsg -t get_tree` if a future update renames it.
for_window [class="cs2"] {
    allow_tearing yes
    inhibit_idle fullscreen
}

# Steam itself, so Big Picture does not trip the 300s swaylock timeout
# from 90-swayidle.conf while a controller is driving the session.
# Lower-case "steam" is the class the client actually sets, confirmed against
# a running instance — sway criteria are case-sensitive, so "Steam" silently
# matches nothing.
for_window [class="steam"] {
    inhibit_idle fullscreen
}
