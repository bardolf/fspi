# Idle and lock configuration — overrides /usr/share/sway/config.d/90-swayidle.conf
# Replaces stock `swaylock` with the source-built `swaylock-effects`
# (see steps/18_swaylock_effects.sh) and points it at our effects config.
#
# Timing knobs are inherited from the upstream snippet via $lock_timeout /
# $screen_timeout (defaults: 300s lock, 60s screen-off after lock).
#
# Requires: swayidle
# Requires: ~/.local/bin/swaylock-effects (built by steps/18_swaylock_effects.sh)
# Requires: ~/.config/swaylock/effects.conf (deployed by steps/20_config.sh)
# Requires: /usr/bin/pkill, /usr/bin/pidof, /usr/bin/xargs

set $swaylock_cmd ~/.local/bin/swaylock-effects -f -C ~/.config/swaylock/effects.conf

# `pidof` (not `pgrep -x`) because /proc/PID/comm is truncated to 15 chars
# and "swaylock-effects" is 16 — pgrep/pkill -x against the full name never
# match. pidof reads basename(/proc/PID/exe), which isn't truncated.
#
# exec_always (not exec) so `sway reload` re-launches swayidle with the
# updated args. The leading pkill prevents duplicate swayidle instances
# piling up on every reload.
exec_always LT="$lock_timeout" ST="$screen_timeout" LT=${LT:-300} ST=${ST:-60} && \
    pkill -x swayidle; \
    swayidle -w \
        timeout $LT '$swaylock_cmd' \
        timeout $((LT + ST)) 'swaymsg "output * power off"' \
                      resume 'swaymsg "output * power on"'  \
        timeout $ST 'pidof -q swaylock-effects && swaymsg "output * power off"' \
             resume 'pidof -q swaylock-effects && swaymsg "output * power on"'  \
        before-sleep '$swaylock_cmd' \
        lock '$swaylock_cmd' \
        unlock 'pidof swaylock-effects | xargs -r kill -SIGUSR1'
