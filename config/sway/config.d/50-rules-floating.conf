# Floating rules for apps that work better as floating windows
for_window [app_id="io.github.Qalculate.qalculate-qt"] floating enable
# Lobo (vlastni hra) - app_id pro nativni Wayland, class pro pripadny XWayland fallback
for_window [app_id="lobo"] floating enable
for_window [class="lobo"] floating enable
