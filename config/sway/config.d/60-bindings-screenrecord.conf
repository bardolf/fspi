# Key bindings for screen recording (video)
#
# Toggle-style: press the region binding once to freeze the screen and pick a
# region with slurp, which starts recording; press it again to stop and
# finalize the .mp4 in ~/Videos/Screencasts.
#
# Requires:     wf-recorder, slurp, wayfreeze, jq
# Script:       ~/scripts/screen-record.sh

bindsym {
    $mod+Shift+Print  exec ~/scripts/screen-record.sh region
    $mod+Ctrl+Print   exec ~/scripts/screen-record.sh fullscreen
}
