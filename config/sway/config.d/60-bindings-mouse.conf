# Thumb scroll wheel -> volume control
# button6 = horizontal scroll left  (thumb wheel back  -> volume down)
# button7 = horizontal scroll right (thumb wheel forward -> volume up)
#
# Bound per device, never for all inputs: a --whole-window binding swallows
# the event, so a catch-all one turned every sideways component of a
# two-finger touchpad scroll (ikhal, browser, ...) into a volume change and
# killed horizontal scrolling on the touchpad.
#
# The receiver advertises REL_HWHEEL on both its Mouse and its Consumer
# Control node, so both are bound. Another mouse / receiver / Bluetooth
# pairing has its own identifier; add it here:
#   swaymsg -t get_inputs | jq -r '.[] | select(.type=="pointer") | .identifier'
bindsym --whole-window --input-device=1133:50504:Logitech_USB_Receiver_Mouse button6 exec ~/scripts/waybar/audio-status.sh down
bindsym --whole-window --input-device=1133:50504:Logitech_USB_Receiver_Mouse button7 exec ~/scripts/waybar/audio-status.sh up
bindsym --whole-window --input-device=1133:50504:Logitech_USB_Receiver_Consumer_Control button6 exec ~/scripts/waybar/audio-status.sh down
bindsym --whole-window --input-device=1133:50504:Logitech_USB_Receiver_Consumer_Control button7 exec ~/scripts/waybar/audio-status.sh up
