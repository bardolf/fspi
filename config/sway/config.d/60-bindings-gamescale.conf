# Key binding for the XWayland game-scale workaround
#
# Toggle-style: press once before launching a game to put the focused output
# at 1:1, press again afterwards to restore the configured scale. Needed
# because XWayland cannot render at the 1.3 fractional scale the 4K Dell uses
# (see config.d/10-displays.conf) — see the script header for the full why.
#
# Requires:     jq
# Script:       ~/scripts/sway-game-scale.sh

bindsym $mod+Shift+g exec ~/scripts/sway-game-scale.sh toggle
