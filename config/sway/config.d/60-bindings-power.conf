# Power off straight from the lock screen.
#
# The $mod+escape menu (scripts/menu_shutdown.sh) is rofi-driven and therefore
# useless while locked: under the ext-session-lock protocol the lock surface
# holds keyboard focus, so rofi comes up with no way to type into it. Same goes
# for a swaynag confirmation prompt — there is no way to confirm anything under
# a lock, which is why this binding fires immediately with no "are you sure".
#
# `--locked` is the sway(5) flag that lets a binding run while the screen is
# locked; without it sway drops the binding for the duration of the lock. The
# chord is deliberately four keys so a bumped keyboard or a cat cannot hit it.
# It works unlocked too — --locked widens when a binding fires, it does not
# restrict it to the locked state.
#
# No security is given up here: anyone who can reach the keyboard can already
# hold the physical power button, and logind is configured HandlePowerKey=poweroff,
# so a short press of that button already powers the box off while locked.
# This just adds a keyboard route that does the same clean shutdown.
#
# systemctl poweroff needs no password because polkit grants
# org.freedesktop.login1.power-off to an *active* local session, and a locked
# session is still active — locking does not deactivate a seat.
bindsym --locked $mod+Ctrl+Shift+p exec systemctl poweroff
