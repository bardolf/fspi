# Picture-in-picture: malé plovoucí okno viditelné na všech workspacech
# Spouštěj přehrávač jako:  mpv --title=pip <url>
for_window [title="^pip$"] floating enable, sticky enable, border none, move position 62 ppt 5 ppt

# Nativní PiP okno prohlížeče (Firefox / Chromium / Brave / Vivaldi)
for_window [title="^Picture-in-Picture$"] floating enable, sticky enable, border none

# Mod+Shift+Y = přehraj URL ze schránky v PiP okně.
# Živý přenos se pouští OD ZAČÁTKU: YouTube v HLS playlistu drží celý přenos
# (EXT-X-MEDIA-SEQUENCE:0), ale ffmpeg u live playlistu startuje na živé hraně
# — live_start_index=0 ho pošle na první segment. Zpětné převíjení pak drží
# demuxer-max-back-bytes. Dopředu jde skočit jen po načtenou hranici, protože
# bez EXT-X-ENDLIST ffmpeg nezná celkovou délku.
# NEPOUŽÍVAT --ytdl-raw-options=live-from-start= : yt-dlp z něj dělá protokol
# dashG (fragmenty si tahá sám) a mpv dostane jen DASH manifest, který ffmpeg
# neotevře ("dash: Error when loading first fragment of playlist").
# U běžného videa se live_start_index neprojeví — duration i seek jsou přesné.
bindsym $mod+Shift+y exec mpv --title=pip --autofit=640 \
    --ytdl-format="bestvideo[height<=?720]+bestaudio/best[height<=?720]/best" \
    --demuxer-lavf-o=live_start_index=0 \
    --force-seekable=yes --demuxer-max-back-bytes=400MiB \
    "$(wl-paste)"
