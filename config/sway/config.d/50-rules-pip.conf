# Picture-in-picture: malé plovoucí okno viditelné na všech workspacech
# Spouštěj přehrávač jako:  mpv --title=pip <url>
for_window [title="^pip$"] floating enable, sticky enable, border none, move position 62 ppt 5 ppt

# Nativní PiP okno prohlížeče (Firefox / Chromium / Brave / Vivaldi)
for_window [title="^Picture-in-Picture$"] floating enable, sticky enable, border none

# Mod+Shift+Y = přehraj URL ze schránky v PiP okně. Živý přenos se pouští
# od začátku a s přesným převíjením — detaily a proč to nejde napsat jako
# jednoduchý mpv příkaz jsou v komentáři skriptu.
bindsym $mod+Shift+y exec ~/scripts/pip_play.sh
