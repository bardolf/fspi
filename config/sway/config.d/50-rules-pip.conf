# Picture-in-picture: malé plovoucí okno viditelné na všech workspacech
# Spouštěj přehrávač jako:  mpv --title=pip <url>
for_window [title="^pip$"] floating enable, sticky enable, border none, move position 62 ppt 5 ppt

# Nativní PiP okno prohlížeče (Firefox / Chromium / Brave / Vivaldi)
for_window [title="^Picture-in-Picture$"] floating enable, sticky enable, border none

# Mod+Shift+Y = přehraj URL ze schránky v PiP okně.
# Živý přenos se pouští OD ZAČÁTKU a s plným převíjením: live-from-start
# přepne yt-dlp z HLS na DASH manifest; jen u HLS je seek oříznutý na cache,
# i když duration hlásí celou délku přenosu. U běžného videa se neprojeví.
bindsym $mod+Shift+y exec mpv --title=pip --autofit=640 \
    --ytdl-format="bestvideo[height<=?720]+bestaudio/best" \
    --ytdl-raw-options=live-from-start= \
    --force-seekable=yes --demuxer-max-back-bytes=400MiB \
    "$(wl-paste)"
