# Keep webcam microphones out of PipeWire's ALSA "split" path.
#
# WirePlumber 0.5.14 turns on api.alsa.split-enable for every ALSA card
# (/usr/share/wireplumber/scripts/monitors/alsa.lua). On the Microsoft LifeCam
# HD-5000 — a capture-only USB card with a single mono mic — that leaves the
# card with an EMPTY EnumProfile while its active Profile still reports "off".
# The HDMI and analog cards on this box enumerate profiles normally, so this is
# specific to the profile-less webcam, not a global split problem.
#
# pipewire-pulse resolves pa_card_info.active_profile by looking the active
# profile up in the profile list. With that list empty the pointer comes out
# NULL, and `pactl list cards` shows the card with no "Active Profile:" line at
# all — the tell-tale symptom.
#
# The Steam client (bundled libaudio.so) dereferences that pointer in its
# pa_context_get_card_info_list callback and segfaults during startup, so Steam
# dies before it can launch anything. Backtrace:
#
#   #0 libaudio.so                              <- Steam's callback, NULL deref
#   #1 context_get_card_info_callback  libpulse.so.0
#   #2 run_action                      libpulsecommon-17.0.so
#
# The bug is Steam's — a profile-less card is legal in the PulseAudio API — but
# Steam bootstraps its own client into ~/.local/share/Steam and self-updates
# outside dnf, so pinning or reverting it is not an option. Fixing the card is.
#
# Turning split off for webcams restores the normal ACP profile set
# (off / pro-audio / input:mono-fallback) and the mic keeps working. Webcam
# audio is always a plain mono or stereo mic, so the split machinery buys
# nothing there anyway. A new webcam needs its own name added to the match
# below - there is no generic "this card is a webcam" property to key off.
#
# Verify after changing this (restart wireplumber first):
#   pactl list cards | grep -A2 -i lifecam     # must show an "Active Profile:" line
#   pactl list short sources | grep -i HD5000  # the mic must appear as a source
monitor.alsa.rules = [
  {
    matches = [
      # Match on device.name, NOT on device.form_factor: WirePlumber's ALSA
      # monitor never sets form_factor on a card (grep the shipped scripts —
      # the key appears nowhere), so a form_factor match silently never fires
      # and the card keeps split-enable = true. "~" = regex, per the shipped
      # /usr/share/wireplumber/wireplumber.conf.d/alsa-vm.conf.
      { device.name = "~alsa_card\\.usb-.*LifeCam.*" }
    ]
    actions = {
      update-props = {
        api.alsa.split-enable = false
      }
    }
  }
]
