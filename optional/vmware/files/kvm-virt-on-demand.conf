# Managed by fspi (optional/vmware/setup.sh).
# Since kernel 6.12 KVM turns AMD-V/VT-x on when the module loads and keeps it
# on even with no KVM guest running, which out-of-tree hypervisors (VMware,
# VirtualBox) then cannot have. With 0 KVM takes it only while a KVM guest runs.
options kvm enable_virt_at_load=0
